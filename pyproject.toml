[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[project]
name = "agentrig"
version = "0.1.0"
description = "Typed infrastructure for composing heterogeneous AI agents and capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[tool.uv]
required-version = "==0.12.3"
exclude-newer = "2026-08-12T00:00:00Z"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = [
  "evals",
  "src/agentrig",
  "tools/typecheck.py",
  "tests/typing/valid_coding_capability.py",
  "tests/typing/valid_agent_step.py",
  "tests/typing/valid_approval_step.py",
  "tests/typing/valid_eval_contracts.py",
  "tests/typing/valid_grade_step.py",
  "tests/typing/valid_repair_loop.py",
  "tests/typing/valid_sequence.py",
  "tests/typing/valid_structured_generation.py",
  "tests/typing/valid_text_generation.py",
  "tests/typing/valid_workflow_agent.py",
]
show_error_codes = true
pretty = true
